# Production, self-hosted on the VM. Separate from docker-compose.yml, which
# stays dev-only (no `app` service, host-published Mongo port for local tools).
# nginx on the host terminates TLS and proxies to `app`; nothing here is
# published beyond 127.0.0.1, so the app is never directly internet-facing.
services:
  mongo:
    image: mongo:7
    container_name: railserve-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - railserve-mongodata:/data/db
    healthcheck:
      # Member host is `mongo:27017` (the Docker Compose service name), unlike
      # the dev compose file's `localhost:27017` — here, every client
      # (including the `app` container) is a *different* container from
      # `mongo`, so a `localhost` self-reference in the replica set's own
      # topology gossip resolves to whichever container asks, not to mongo.
      # The driver reconnects using that advertised host after its initial
      # handshake, so a wrong value here breaks every real query with
      # ECONNREFUSED on ::1/127.0.0.1 — even though the first connection and
      # `rs.status()` both look fine.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok
          }"
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 5s
    restart: always

  app:
    build: .
    container_name: railserve-app
    env_file: .env.production
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: always

volumes:
  railserve-mongodata:
